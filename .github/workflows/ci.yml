name: CI

on:
  push:
    branches: [develop, master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          ['3.10', '3.11', '3.12', '3.13', '3.14', 'pypy3.10', 'pypy3.11']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: test-${{ matrix.python-version }}
      # tox-gh-actions maps the running interpreter to the matching env via the
      # [gh-actions] table in tox.ini (PyPy keyed as `pypy-3.10` / `pypy-3.11`).
      # COVERAGE_FILE gives each cell a unique data file for the combine job.
      - run: uvx --with tox-uv --with tox-gh-actions tox
        env:
          COVERAGE_FILE: .coverage.${{ matrix.python-version }}
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-suffix: lint
      - name: Apply Ruff fixes to pull requests
        if: github.event_name == 'pull_request'
        run: uvx --with tox-uv tox -e ruff-fix
      - run: uvx --with tox-uv tox -e lint
        env:
          RUFF_OUTPUT_FORMAT: >-
            ${{ github.event_name == 'pull_request' && 'github' || 'full' }}

  type-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checker: [mypy, pyright, pyrefly]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-suffix: type-check-${{ matrix.checker }}
      - run: uvx --with tox-uv tox -e ${{ matrix.checker }}

  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-suffix: codespell
      - run: uvx --with tox-uv tox -e codespell

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-suffix: docs
      - run: uvx --with tox-uv tox -e docs

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-suffix: coverage
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: uv run coverage combine
      - run: uv run coverage report --show-missing --fail-under=100
      - run: uv run coverage lcov -o coverage.lcov
      - name: Upload combined coverage to Coveralls
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/')
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage.lcov
          format: lcov
          fail-on-error: true
